var PT=[[/^Saved: (.*)$/,function(m){return"സേവ് ചെയ്തു: "+m[1]}],

[/^(.*) \(reorder at (.*)\)$/,function(m){return m[1]+" (റീഓർഡർ "+m[2]+")"}],
[/^Avg cost (.*) per (.*)$/,function(m){return"ശരാശരി വില "+m[1]+" / "+m[2]}],
[/^Standard (.*) · stock (.*)$/,function(m){return"സ്റ്റാൻഡേർഡ് "+m[1]+" · സ്റ്റോക്ക് "+m[2]}],
[/^stock (.*)$/,function(m){return"സ്റ്റോക്ക് "+m[1]}],
[/^Bottles from litres \((.*)\)$/,function(m){return"ലിറ്ററിൽ നിന്നുള്ള ബോട്ടിലുകൾ ("+m[1]+")"}],
[/^(.*) L batch$/,function(m){return m[1]+" L ബാച്ച്"}],

[/^Entered by (.*)$/,function(m){return"രേഖപ്പെടുത്തിയത്: "+m[1]}],
[/^(.*) L \(yield (.*)%\)$/,function(m){return m[1]+" L (വിളവ് "+m[2]+"%)"}],
[/^(Pass|Fail)( · .*)?$/,function(m){return(m[1]=="Pass"?"വിജയം":"പരാജയം")+(m[2]||"").replace("Brix","ബ്രിക്സ്")}],

[/^Not enough stock: (.*)$/,function(m){return"സ്റ്റോക്ക് മതിയാകില്ല: "+m[1]}],

function tr(s){if(D.hasOwnProperty(s))return D[s];for(var i=0;i<PT.length;i++){var m=s.match(PT[i][0]);if(m)return PT[i][1](m)}return s}
function trNode(r){if(!r)return;var w=document.createTreeWalker(r,4),n,L=[];while(n=w.nextNode())L.push(n);
 L.forEach(function(n){var s=n.nodeValue,c=s.trim();if(!c)return;var t=tr(c);if(t!==c)n.nodeValue=s.replace(c,t)});
 r.querySelectorAll("[placeholder]").forEach(function(e){e.setAttribute("placeholder",tr(e.getAttribute("placeholder")))})}
function trDom(){trNode($("app"));trNode($("nav"))}
function draw(){draw0();if(lang=="ml")trDom()}

var editMat=null,adminErr="";

function matEditCard(){var m=editMat&&M(editMat);if(!m){editMat=null;return""}

function saveMat(){
 if(!isAdmin){say("Only admin can edit stock");return}
 var m=M(editMat),n=$("en").value.trim(),u=$("eu").value.trim(),r=parseFloat($("er").value),c=parseFloat($("ec").value),st=parseFloat($("es").value);
 if(!m||!n||!u||isNaN(r)||isNaN(c)||isNaN(st)||c<0||st<0){say("Fill all fields with valid numbers");return}
 var wb=db.batch();
 wb.update(db.collection("mat").doc(m.id),{name:n,unit:u,reorder:r,cost:c,stock:st});
 if(st!=m.stock||c!=m.cost||u!=m.unit||n!=m.name)wb.set(db.collection("adjustments").doc(),{date:today(),mat:n,oldName:m.name,oldStock:m.stock,newStock:st,oldCost:m.cost,newCost:c,oldUnit:m.unit,newUnit:u,reason:$("ew").value,by:user.email,ts:Date.now()});
 wb.commit().then(function(){editMat=null;say("Saved: "+n)}).catch(fail);
}
function bots(l){var n=0;l.forEach(function(b){n+=b.bottles||b.out*1000/(b.bsize||1000)});return n}
function fq(n){return String(Math.round(n*1000)/1000)}
var dp=null;window.addEventListener("beforeinstallprompt",function(e){e.preventDefault();dp=e;draw()});
function inst(){if(dp){dp.prompt();dp=null;draw()}}
function setQ(id,v){var m=M(id),r=rowOf(id),q=parseFloat(v);
 if(!(q>0)){if(r)bd.rows.splice(bd.rows.indexOf(r),1);calc();return}
 if(!r){r={m:id,q:0,std:null,u:null};bd.rows.push(r)}
 r.q=q*getF(m,uOf(m,r));calc()}
function setU(id,v){bd.uu=bd.uu||{};bd.uu[id]=v;var r=rowOf(id);if(r)r.u=v;draw()}
function newBd(){return{name:"",liters:100,out:95,rec:null,rows:[],date:today(),editId:null,old:[],f:{bs:"",bz:"1000",bn:"",bl:"0",bu:"0",bh:"0",bb:"",bp:"",bq:"Pass"}}}
var bd=newBd();
function say(t){toast=t;draw();setTimeout(function(){toast="";draw()},2400)}
function go(t){tab=t;draw()}
function typing(){var a=document.activeElement;return a&&(a.tagName=="INPUT"||a.tagName=="SELECT")}
function fail(e){say("Failed: "+(e.code||e.message))}

auth.onAuthStateChanged(function(u){
 user=u;isAdmin=false;if(u)db.collection("admins").doc(u.uid).get().then(function(d){isAdmin=d.exists;adminErr=d.exists?"":"no admin record found";draw()}).catch(function(e){adminErr=e.code||"error";draw()});unsubs.forEach(function(x){x()});unsubs=[];
 if(u){["mat","rec","batches","sizes"].forEach(function(c){
  unsubs.push(db.collection(c).onSnapshot(function(s){
   S[c]=s.docs.map(function(d){var o=d.data();o.id=d.id;return o});
   if(c=="batches")S[c].sort(function(a,b){return (b.date+b.ts)>(a.date+a.ts)?1:-1});
   if(c=="mat")S[c].sort(function(a,b){return a.name.localeCompare(b.name)});
   if(c=="sizes")S[c].sort(function(a,b){return a.ml-b.ml});
   if(!typing())draw()},function(e){say("Sync error: "+e.code)}))})}
 else S={mat:[],rec:[],batches:[],sizes:[]};
 draw()});

 var tb=S.batches.filter(function(b){return b.date==today()}),out=0,cost=0;tb.forEach(function(b){out+=b.out;cost+=b.total});
 var low=S.mat.filter(function(m){return m.stock<=m.reorder});
 return '<h1>Today’s production</h1><div class="big"><div><b>'+tb.length+'</b><span>Batches</span></div><div><b>'+f(out,0)+' L</b><span>Output</span></div><div><b>'+(out?f(cost/out):"–")+'</b><span>Cost per litre</span></div><div><b>'+(out?f(cost/bots(tb)):"–")+'</b><span>Cost per bottle</span></div></div>'+

 '<label>Supplier</label><input id="ps"><label>Lot / invoice no.</label><input id="pl"><label>Quantity and unit</label><div style="display:flex;gap:8px"><input id="pq" type="number" inputmode="decimal">'+usel("pu",first)+'</div><label>Price per selected unit</label><input id="pp" type="number" inputmode="decimal"><button onclick="buy()">Save purchase</button></div>'+

function buy(){
 var m=M($("pm").value),q=parseFloat($("pq").value),p=parseFloat($("pp").value);
 if(!m||!(q>0)||isNaN(p)){say("Enter material, quantity and price");return}
 var u=$("pu").value,F=getF(m,u),qb=q*F,pb=p/F,wb=db.batch();
 wb.update(db.collection("mat").doc(m.id),{stock:FV.increment(qb),cost:(m.stock*m.cost+qb*pb)/(m.stock+qb)});
 wb.set(db.collection("purchases").doc(),{date:today(),mat:m.name,supplier:$("ps").value,lot:$("pl").value,qty:q,unit:u,price:p,by:user.email,ts:Date.now()});
 wb.commit().then(function(){say("Purchase saved: "+fq(qb)+" "+m.unit+" of "+m.name)}).catch(fail);
}
function addMat(){
 var n=$("nn").value.trim();if(!n){say("Enter a name");return}
 db.collection("mat").add({name:n,unit:$("nu").value||"kg",stock:0,cost:0,reorder:parseFloat($("nr").value)||0}).then(function(){say("Added "+n)}).catch(fail);
}
function delMat(id){if(!isAdmin){say("Only admin can delete");return}
 var m=M(id);if(!confirm("Remove "+m.name+"? It will also be removed from saved recipes."))return;
 var wb=db.batch();wb.delete(db.collection("mat").doc(id));
 S.rec.forEach(function(r){wb.update(db.collection("rec").doc(r.id),{items:r.items.filter(function(it){return it.m!=id})})});
 wb.commit().then(function(){say(m.name+" removed")}).catch(fail);
}

 '<h2>Output and costs</h2><div class="card"><label>Output (litres)</label><input type="number" inputmode="decimal" value="'+b.out+'" oninput="bd.out=parseFloat(this.value)||0;calc()">'+sizeUI()+fld('bn','Bottles actually filled (optional)','number')+fld('bl','Labor','number')+fld('bu','Electricity, gas and water','number')+fld('bh','Other overhead','number')+'</div>'+
 '<h2>Quality check</h2><div class="card">'+fld('bb','Brix','number')+fld('bp','pH','number')+'<label>Result</label><select onchange="bd.f.bq=this.value"><option'+(b.f.bq=="Pass"?" selected":"")+' value="Pass">Pass</option><option'+(b.f.bq=="Fail"?" selected":"")+' value="Fail">Fail</option></select></div>'+
 '<div class="card" id="sum"></div><button onclick="saveBatch()">'+(b.editId?"Save changes":"Save batch")+'</button>'+(b.editId?'<button class="s" onclick="bd=newBd();go(\'rep\')">Cancel</button>':"");
}
function vals(){
 var mat=0;bd.rows.forEach(function(r){var m=M(r.m);if(m)mat+=r.q*m.cost});
 var g=function(k){return parseFloat(bd.f[k])||0};
 return{mat:mat,other:g("bl")+g("bu")+g("bh"),total:mat+g("bl")+g("bu")+g("bh"),out:bd.out,input:bd.liters,bz:g("bz")||1000,bn:g("bn")};
}
function calc(){
 if(!$("sum"))return;var v=vals(),exp=v.out*1000/v.bz,nb=v.bn>0?v.bn:exp,R=function(a,b,c){return '<div class="row"><span class="n">'+a+'</span><b'+(c?' class="'+c+'"':'')+'>'+b+'</b></div>'};
 $("sum").innerHTML=R("Material cost",f(v.mat))+R("Labor and overhead",f(v.other))+R("Total batch cost",f(v.total))+R("Cost per litre",v.out?f(v.total/v.out):"–","ok")+
  R("Bottles from litres ("+fq(v.out)+" L ÷ "+fq(v.bz)+" ml)",v.out?fq(Math.round(exp*10)/10):"–")+
  (v.bn>0?R("Bottles actually filled",fq(v.bn))+R("Difference",(v.bn-exp>=0?"+":"")+fq(Math.round((v.bn-exp)*10)/10),v.bn<exp?"low":"ok"):"")+
  R("Cost per bottle",nb>0?f(v.total/nb):"–","ok")+R("Yield",v.input?f(v.out/v.input*100,1)+"%":"–");if(lang=="ml")trNode($("sum"));
}
function saveBatch(){
 var v=vals(),rows=bd.rows.filter(function(r){return M(r.m)&&r.q>0});
 if(!bd.name.trim()){say("Type the juice name");return}
 if(!rows.length){say("Add at least one material");return}
 if(!(v.out>0)||!(v.input>0)){say("Enter batch size and output litres");return}
 for(var i=0;i<rows.length;i++){
  var avail=M(rows[i].m).stock;
  bd.old.forEach(function(u){if(u.m==rows[i].m)avail+=u.act});
  if(rows[i].q>avail){say("Not enough stock: "+M(rows[i].m).name);return}}
 var wb=db.batch(),ref=bd.editId?db.collection("batches").doc(bd.editId):db.collection("batches").doc();
 bd.old.forEach(function(u){if(M(u.m))wb.update(db.collection("mat").doc(u.m),{stock:FV.increment(u.act)})});
 var use=rows.map(function(r){wb.update(db.collection("mat").doc(r.m),{stock:FV.increment(-r.q)});return{m:r.m,name:M(r.m).name,unit:M(r.m).unit,std:r.std==null?r.q:r.std,act:r.q}});
 var g=function(k){return parseFloat(bd.f[k])||0};
 wb.set(ref,{date:bd.date,recipe:bd.name.trim(),shift:bd.f.bs,use:use,mat:v.mat,labor:g("bl"),util:g("bu"),oh:g("bh"),total:v.total,out:v.out,input:v.input,bsize:v.bz,bottles:Math.round(v.bn>0?v.bn:v.out*1000/v.bz),bfilled:v.bn||0,brix:bd.f.bb,ph:bd.f.bp,qc:bd.f.bq,by:user.email,ts:Date.now()});
 wb.commit().then(function(){var cpl=f(v.total/v.out);rdate=bd.date;bd=newBd();say("Batch saved: "+cpl+" per litre");setTimeout(function(){go("rep")},900)}).catch(fail);
}
function editB(id){
 var b=S.batches.find(function(x){return x.id==id});
 bd={name:b.recipe,liters:b.input,out:b.out,rec:null,date:b.date,editId:id,old:b.use,rows:b.use.map(function(u){return{m:u.m,q:u.act,std:u.std}}),
  f:{bs:b.shift||"",bz:String(b.bsize||1000),bn:String(b.bfilled||""),bl:String(b.labor||0),bu:String(b.util||0),bh:String(b.oh||0),bb:b.brix||"",bp:b.ph||"",bq:b.qc||"Pass"}};
 go("batch");
}
function delB(id){if(!isAdmin){say("Only admin can delete");return}
 var b=S.batches.find(function(x){return x.id==id});
 if(!confirm("Delete this batch? Materials used will be put back into stock."))return;
 var wb=db.batch();
 b.use.forEach(function(u){if(M(u.m))wb.update(db.collection("mat").doc(u.m),{stock:FV.increment(u.act)})});
 wb.delete(db.collection("batches").doc(id));
 wb.commit().then(function(){say("Batch deleted")}).catch(fail);
}

function recs(){
 return '<h1>Juice recipes</h1>'+S.rec.map(function(r){return '<div class="card"><b>'+esc(r.name)+'</b> <span class="mut">'+r.liters+' L batch</span>'+r.items.filter(function(it){return M(it.m)}).map(function(it){var m=M(it.m);return '<div class="row"><span class="n">'+esc(m.name)+'</span>'+fq(it.q)+' '+esc(m.unit)+'</div>'}).join("")+''+(isAdmin?'<button class="s" onclick="delRec(\''+r.id+'\')">Delete recipe</button>':'')+'</div>'}).join("")+
 '<h2>Add a juice</h2><div class="card"><label>Juice name</label><input value="'+esc(draft.name)+'" placeholder="e.g. Mango Juice 100 L" oninput="draft.name=this.value"><label>Batch size (litres)</label><input type="number" inputmode="decimal" value="'+draft.liters+'" oninput="draft.liters=parseFloat(this.value)||0">'+
 draft.items.map(function(it,i){var m=M(it.m);return m?'<div class="row"><span class="n">'+esc(m.name)+'</span>'+fq(it.q)+' '+esc(m.unit)+'<button class="s sm" onclick="draft.items.splice('+i+',1);draw()">Remove</button></div>':""}).join("")+
 '<label>Ingredient</label><select id="di" onchange="fillU(\'di\',\'du\')">'+S.mat.map(function(m){return '<option value="'+m.id+'">'+esc(m.name)+' ('+esc(m.unit)+')</option>'}).join("")+'</select><label>Standard quantity and unit</label><div style="display:flex;gap:8px"><input id="dq" type="number" inputmode="decimal">'+usel("du",S.mat[0]||{unit:""})+'</div><button class="s" onclick="addIt()">Add ingredient</button><button onclick="saveRec()">Save juice</button></div>'+sizesCard();
}
function addIt(){var m=M($("di").value),q=parseFloat($("dq").value);if(!m||!(q>0)){say("Choose an ingredient and quantity");return}draft.items.push({m:m.id,q:q*getF(m,$("du").value)});draw()}
function saveRec(){
 if(!draft.name.trim()||!draft.items.length||!(draft.liters>0)){say("Add a name, batch size and ingredients");return}
 db.collection("rec").add({name:draft.name.trim(),liters:draft.liters,items:draft.items}).then(function(){draft={name:"",liters:100,items:[]};say("Juice saved")}).catch(fail);
}
function delRec(id){if(!isAdmin){say("Only admin can delete");return}if(confirm("Delete this recipe? Past batches stay in reports."))db.collection("rec").doc(id).delete().catch(fail)}

function bcard(b){
 var varc=b.use.reduce(function(s,u){return s+(u.act-u.std)*(M(u.m)||{cost:0}).cost},0);
 return '<div class="card"><b>'+esc(b.recipe)+'</b> <span class="mut">'+b.date+(b.shift?" · "+esc(b.shift):"")+'</span>'+
 '<div class="row"><span class="n">Output</span>'+f(b.out,0)+' L (yield '+f(b.out/b.input*100,1)+'%)</div>'+
 '<div class="row"><span class="n">Total cost</span>'+f(b.total)+'</div>'+
 '<div class="row"><span class="n">Cost per litre</span><b class="ok">'+f(b.total/b.out)+'</b></div>'+
 '<div class="row"><span class="n">Bottles ('+(b.bsize||1000)+' ml)</span><b>'+(b.bottles||Math.round(b.out*1000/(b.bsize||1000)))+'</b></div>'+
 '<div class="row"><span class="n">Cost per bottle</span><b class="ok">'+f(b.total/(b.bottles||b.out*1000/(b.bsize||1000)))+'</b></div>'+
 '<div class="row"><span class="n">Usage vs standard</span><span class="'+(varc>0?"low":"ok")+'">'+(varc>0?"+":"")+f(varc)+'</span></div>'+
 '<div class="row"><span class="n">Quality</span><span class="'+(b.qc=="Pass"?"ok":"low")+'">'+esc(b.qc)+(b.brix?" · Brix "+esc(b.brix):"")+(b.ph?" · pH "+esc(b.ph):"")+'</span></div>'+
 '<div class="mut">Entered by '+esc(b.by||"")+'</div>'+
 '<div style="display:flex;gap:8px"><button class="s" onclick="editB(\''+b.id+'\')">Edit</button>'+(isAdmin?'<button class="s" onclick="delB(\''+b.id+'\')">Delete</button>':'')+'</div></div>';
}
function rep(){
 var td=S.batches.filter(function(b){return b.date==rdate}),out=0,cost=0,cons={},units={};
 td.forEach(function(b){out+=b.out;cost+=b.total;b.use.forEach(function(u){cons[u.name]=(cons[u.name]||0)+u.act;units[u.name]=u.unit})});
 var keys=Object.keys(cons);
 return '<h1>Reports</h1>'+exportCard()+'<div class="card"><label>Date</label><input type="date" value="'+rdate+'" onchange="rdate=this.value;draw()"></div>'+
 '<div class="big"><div><b>'+td.length+'</b><span>Batches</span></div><div><b>'+f(out,0)+' L</b><span>Output</span></div><div><b>'+(out?f(cost/out):"–")+'</b><span>Cost per litre</span></div><div><b>'+(out?f(cost/bots(td)):"–")+'</b><span>Cost per bottle</span></div></div>'+
 '<h2>Materials consumed</h2><div class="card">'+(keys.length?keys.map(function(k){return '<div class="row"><span class="n">'+esc(k)+'</span><b>'+fq(cons[k])+' '+esc(units[k]||"")+'</b></div>'}).join(""):'<span class="mut">No batches on this date.</span>')+'</div>'+
 '<h2>Batches</h2>'+(td.length?td.map(bcard).join(""):'<div class="card mut">Nothing saved for this date.</div>');
}
if("serviceWorker" in navigator)window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})});
draw();
</script></body></html>
