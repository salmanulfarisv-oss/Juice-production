<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Juice Production Tracker</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#fbf7f0;--sf:#fff;--ink:#2a1a2e;--mut:#7a6b7d;--ac:#e8590c;--ac2:#2f7d4f;--bad:#c92a2a;--ln:#e9e0d3}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1420;--sf:#281d2d;--ink:#f5ecf6;--mut:#a998ad;--ac:#ff8a4c;--ac2:#5cc98a;--bad:#ff7b7b;--ln:#3b2e41}}
:root[data-theme="dark"]{--bg:#1c1420;--sf:#281d2d;--ink:#f5ecf6;--mut:#a998ad;--ac:#ff8a4c;--ac2:#5cc98a;--bad:#ff7b7b;--ln:#3b2e41}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:76px}
main{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:1.5rem;margin:4px 0 14px}h2{font-size:1.1rem;margin:20px 0 8px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:14px;margin-bottom:12px}
.big{display:flex;gap:10px}.big>div{flex:1;background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:12px}
.big b{display:block;font-size:1.5rem;color:var(--ac)}.big span,.mut{color:var(--mut);font-size:.85rem}
label{display:block;font-size:.85rem;color:var(--mut);margin:10px 0 4px}
input,select,button{font:inherit;width:100%;padding:11px;border-radius:10px;border:1px solid var(--ln);background:var(--bg);color:var(--ink)}
button{background:var(--ac);color:#fff;border:0;font-weight:600;margin-top:14px}
button.s{background:var(--bg);color:var(--ink);border:1px solid var(--ln);margin-top:8px}
.row{display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--ln)}.row:last-child{border:0}
.row>.n{flex:1}.row input{width:96px;text-align:right}
.low{color:var(--bad);font-weight:600}.ok{color:var(--ac2);font-weight:600}
.r{text-align:right}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--sf);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{margin:0;border-radius:0;background:none;color:var(--mut);border:0;padding:14px 4px;font-size:.85rem}
nav button.on{color:var(--ac);box-shadow:inset 0 3px 0 var(--ac)}
.toast{position:fixed;left:16px;right:16px;bottom:84px;background:var(--ac2);color:#fff;padding:12px;border-radius:10px;text-align:center}
</style></head><body>
<main id="app"></main>
<nav id="nav"></nav>
<script>
var KEY="juice_v1",S,tab="home",toast="";
var seed={mat:[
{id:2,name:"Sugar",unit:"kg",stock:120,cost:0.9,reorder:50},
{id:3,name:"Preservative",unit:"kg",stock:6,cost:12,reorder:3},
{id:4,name:"Bottle 1L",unit:"pcs",stock:800,cost:0.15,reorder:300},
{id:5,name:"Cap",unit:"pcs",stock:900,cost:0.03,reorder:300},
{id:6,name:"Label",unit:"pcs",stock:900,cost:0.02,reorder:300},
{id:7,name:"Grape",unit:"kg",stock:400,cost:1.2,reorder:150},
{id:8,name:"Pineapple",unit:"kg",stock:400,cost:0.8,reorder:150}],
rec:[{id:2,name:"Grape Juice 100 L",liters:100,items:[{m:7,q:120},{m:2,q:10},{m:3,q:0.1},{m:4,q:100},{m:5,q:100},{m:6,q:100}]},
{id:3,name:"Pineapple Juice 100 L",liters:100,items:[{m:8,q:130},{m:2,q:6},{m:3,q:0.1},{m:4,q:100},{m:5,q:100},{m:6,q:100}]}],
batches:[]};
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S)S=JSON.parse(JSON.stringify(seed));
if(!S.v){S.v=2;seed.mat.forEach(function(m){if(!S.mat.some(function(x){return x.id==m.id}))S.mat.push(m)});seed.rec.forEach(function(r){if(!S.rec.some(function(x){return x.id==r.id}))S.rec.push(JSON.parse(JSON.stringify(r)))});try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
var draft={name:"",liters:100,items:[]},selRec=1;
var esc=function(t){return String(t).replace(/"/g,"&quot;").replace(/</g,"&lt;")};
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
var $=function(i){return document.getElementById(i)};
var today=function(){return new Date().toISOString().slice(0,10)};
var M=function(id){return S.mat.find(function(m){return m.id==id})};
var f=function(n,d){return Number(n).toFixed(d==null?2:d)};
function say(t){toast=t;draw();setTimeout(function(){toast="";draw()},2200)}
function go(t){tab=t;draw()}

function draw(){
 var tabs=[["home","Home"],["stock","Stock"],["batch","New batch"],["rec","Recipes"],["rep","Reports"]];
 $("nav").innerHTML=tabs.map(function(t){return '<button class="'+(tab==t[0]?"on":"")+'" onclick="go(\''+t[0]+'\')">'+t[1]+'</button>'}).join("");
 $("app").innerHTML={home:home,stock:stock,batch:batch,rec:recs,rep:rep}[tab]()+(toast?'<div class="toast">'+toast+'</div>':"");
 if(tab=="batch")calc();
}

function home(){
 var tb=S.batches.filter(function(b){return b.date==today()});
 var out=0,cost=0;tb.forEach(function(b){out+=b.out;cost+=b.total});
 var low=S.mat.filter(function(m){return m.stock<=m.reorder});
 return '<h1>Today’s production</h1><div class="big"><div><b>'+tb.length+'</b><span>Batches</span></div><div><b>'+f(out,0)+' L</b><span>Output</span></div><div><b>'+(out?f(cost/out):"–")+'</b><span>Cost per litre</span></div></div>'+
 '<h2>Low stock</h2><div class="card">'+(low.length?low.map(function(m){return '<div class="row"><span class="n">'+m.name+'</span><span class="low">'+f(m.stock,1)+' '+m.unit+' (reorder at '+m.reorder+')</span></div>'}).join(""):'<span class="ok">All materials above reorder level.</span>')+'</div>'+
 '<button onclick="go(\'batch\')">Start a batch</button><button class="s" onclick="go(\'stock\')">Add stock</button>';
}

function stock(){
 return '<h1>Stock</h1><div class="card">'+S.mat.map(function(m){return '<div class="row"><span class="n">'+m.name+'<br><span class="mut">Avg cost '+f(m.cost)+' per '+m.unit+'</span></span><span class="'+(m.stock<=m.reorder?"low":"")+'">'+f(m.stock,1)+' '+m.unit+'</span><button class="s" style="width:auto;margin:0 0 0 8px;padding:6px 10px" onclick="delMat('+m.id+')">Remove</button></div>'}).join("")+'</div>'+
 '<h2>Stock in (purchase)</h2><div class="card"><label>Material</label><select id="pm">'+S.mat.map(function(m){return '<option value="'+m.id+'">'+m.name+' ('+m.unit+')</option>'}).join("")+'</select>'+
 '<label>Supplier</label><input id="ps" placeholder="Supplier name"><label>Lot number</label><input id="pl" placeholder="Lot / invoice no.">'+
 '<label>Quantity</label><input id="pq" type="number" inputmode="decimal"><label>Unit price</label><input id="pp" type="number" inputmode="decimal">'+
 '<button onclick="buy()">Save purchase</button></div>'+
 '<h2>New material</h2><div class="card"><label>Name</label><input id="nn"><label>Unit (kg, L, pcs)</label><input id="nu"><label>Reorder level</label><input id="nr" type="number" inputmode="decimal"><button class="s" onclick="addMat()">Add material</button></div>';
}
function buy(){
 var m=M($("pm").value),q=parseFloat($("pq").value),p=parseFloat($("pp").value);
 if(!(q>0)||isNaN(p)){say("Enter quantity and unit price");return}
 m.cost=(m.stock*m.cost+q*p)/(m.stock+q);m.stock+=q;
 save();say("Purchase saved: "+f(q,1)+" "+m.unit+" of "+m.name);
}
function delMat(id){
 var m=M(id);if(!confirm("Remove "+m.name+" from the material list? It will also be removed from saved recipes."))return;
 S.mat=S.mat.filter(function(x){return x.id!=id});
 S.rec.forEach(function(r){r.items=r.items.filter(function(it){return it.m!=id})});
 bd.rows=bd.rows.filter(function(r){return r.m!=id});draft.items=draft.items.filter(function(it){return it.m!=id});
 save();say(m.name+" removed");
}
function addMat(){
 var n=$("nn").value.trim();if(!n){say("Enter a name");return}
 S.mat.push({id:Date.now(),name:n,unit:$("nu").value||"kg",stock:0,cost:0,reorder:parseFloat($("nr").value)||0});
 save();say("Added "+n);
}

function newBd(){return{name:"",liters:100,out:95,rec:null,rows:[],f:{bs:"",bl:"0",bu:"0",bh:"0",bb:"",bp:"",bq:"Pass"}}}
var bd=newBd();
function scaled(r,l){return r.items.map(function(it){var q=Math.round(it.q*l/r.liters*100)/100;return{m:it.m,q:q,std:q}})}
function loadStd(){var r=S.rec.find(function(x){return x.name.toLowerCase()==bd.name.trim().toLowerCase()});if(r&&!bd.rows.length){bd.rec=r;bd.rows=scaled(r,bd.liters);draw()}}
function setLit(v){var l=parseFloat(v)||0;bd.liters=l;bd.out=Math.round(l*0.95*10)/10;if(bd.rec)bd.rows=scaled(bd.rec,l);draw()}
function addRow(){var q=parseFloat($("aq").value);if(!(q>0)){say("Enter a quantity");return}bd.rows.push({m:+$("am").value,q:q,std:null});draw()}
function fld(k,l,t,ph){return '<label>'+l+'</label><input type="'+t+'" '+(t=="number"?'inputmode="decimal" ':'')+'value="'+esc(bd.f[k])+'" placeholder="'+(ph||"")+'" oninput="bd.f.'+k+'=this.value;calc()">'}
function batch(){
 var b=bd;
 return '<h1>New batch</h1><div class="card"><label>Juice name</label><input list="jn" value="'+esc(b.name)+'" placeholder="Type any juice, e.g. Mango" oninput="bd.name=this.value" onchange="loadStd()"><datalist id="jn">'+S.rec.map(function(r){return '<option value="'+esc(r.name)+'">'}).join("")+'</datalist>'+
 '<label>Batch size (litres)</label><input type="number" inputmode="decimal" value="'+b.liters+'" onchange="setLit(this.value)">'+fld('bs','Shift / supervisor','text','e.g. Morning – Ali')+'</div>'+
 '<h2>Materials used</h2><div class="card">'+(b.rows.length?b.rows.map(function(r,i){var m=M(r.m);return '<div class="row"><span class="n">'+m.name+'<br><span class="mut">'+(r.std!=null?'Standard '+f(r.std,1)+' · ':'')+'stock '+f(m.stock,1)+' '+m.unit+'</span></span><input type="number" inputmode="decimal" value="'+r.q+'" oninput="bd.rows['+i+'].q=parseFloat(this.value)||0;calc()"><button class="s" style="width:auto;margin:0;padding:8px 10px" onclick="bd.rows.splice('+i+',1);draw()">✕</button></div>'}).join(""):'<span class="mut">Type a saved juice name to fill its standard quantities, or add materials below.</span>')+
 '<label>Add material</label><select id="am">'+S.mat.map(function(m){return '<option value="'+m.id+'">'+m.name+' ('+m.unit+')</option>'}).join("")+'</select><label>Quantity used</label><input id="aq" type="number" inputmode="decimal"><button class="s" onclick="addRow()">Add material</button></div>'+
 '<h2>Output and costs</h2><div class="card"><label>Output (litres)</label><input type="number" inputmode="decimal" value="'+b.out+'" oninput="bd.out=parseFloat(this.value)||0;calc()">'+fld('bl','Labor','number')+fld('bu','Electricity, gas and water','number')+fld('bh','Other overhead','number')+'</div>'+
 '<h2>Quality check</h2><div class="card">'+fld('bb','Brix','number')+fld('bp','pH','number')+'<label>Result</label><select onchange="bd.f.bq=this.value"><option'+(b.f.bq=="Pass"?" selected":"")+'>Pass</option><option'+(b.f.bq=="Fail"?" selected":"")+'>Fail</option></select></div>'+
 '<div class="card" id="sum"></div><button onclick="saveBatch()">Save batch</button>';
}
function vals(){
 var mat=0;bd.rows.forEach(function(r){mat+=r.q*M(r.m).cost});
 var g=function(k){return parseFloat(bd.f[k])||0},other=g("bl")+g("bu")+g("bh");
 return{mat:mat,other:other,total:mat+other,out:bd.out,input:bd.liters};
}
function calc(){
 if(!$("sum"))return;var v=vals();
 $("sum").innerHTML='<div class="row"><span class="n">Material cost</span><b>'+f(v.mat)+'</b></div><div class="row"><span class="n">Labor and overhead</span><b>'+f(v.other)+'</b></div><div class="row"><span class="n">Total batch cost</span><b>'+f(v.total)+'</b></div><div class="row"><span class="n">Cost per litre</span><b class="ok">'+(v.out?f(v.total/v.out):"–")+'</b></div><div class="row"><span class="n">Yield</span><b>'+(v.input?f(v.out/v.input*100,1):"–")+'%</b></div>';
}
function saveBatch(){
 var v=vals();
 if(!bd.name.trim()){say("Type the juice name");return}
 if(!bd.rows.length){say("Add at least one material");return}
 if(!(v.out>0)||!(v.input>0)){say("Enter batch size and output litres");return}
 var short=bd.rows.filter(function(r){return r.q>M(r.m).stock});
 if(short.length){say("Not enough stock: "+M(short[0].m).name);return}
 var use=bd.rows.map(function(r){M(r.m).stock-=r.q;return{m:r.m,name:M(r.m).name,std:r.std==null?r.q:r.std,act:r.q}});
 S.batches.unshift({id:Date.now(),date:today(),recipe:bd.name.trim(),shift:bd.f.bs,use:use,mat:v.mat,total:v.total,out:v.out,input:v.input,brix:bd.f.bb,ph:bd.f.bp,qc:bd.f.bq});
 save();var cpl=f(v.total/v.out);bd=newBd();say("Batch saved: "+cpl+" per litre");setTimeout(function(){go("rep")},900);
}
function recs(){
 return '<h1>Juice recipes</h1>'+S.rec.map(function(r){return '<div class="card"><b>'+esc(r.name)+'</b> <span class="mut">'+r.liters+' L batch</span>'+r.items.map(function(it){var m=M(it.m);return '<div class="row"><span class="n">'+m.name+'</span>'+it.q+' '+m.unit+'</div>'}).join("")+'<button class="s" onclick="delRec('+r.id+')">Delete recipe</button></div>'}).join("")+
 '<h2>Add a juice</h2><div class="card"><label>Juice name</label><input value="'+esc(draft.name)+'" placeholder="e.g. Mango Juice 100 L" oninput="draft.name=this.value"><label>Batch size (litres)</label><input type="number" inputmode="decimal" value="'+draft.liters+'" oninput="draft.liters=parseFloat(this.value)||0">'+
 draft.items.map(function(it,i){var m=M(it.m);return '<div class="row"><span class="n">'+m.name+'</span>'+it.q+' '+m.unit+'<button class="s" style="width:auto;margin:0;padding:6px 10px" onclick="draft.items.splice('+i+',1);draw()">Remove</button></div>'}).join("")+
 '<label>Ingredient</label><select id="di">'+S.mat.map(function(m){return '<option value="'+m.id+'">'+m.name+' ('+m.unit+')</option>'}).join("")+'</select><label>Standard quantity per batch</label><input id="dq" type="number" inputmode="decimal"><button class="s" onclick="addIt()">Add ingredient</button><button onclick="saveRec()">Save juice</button></div>';
}
function addIt(){var q=parseFloat($("dq").value);if(!(q>0)){say("Enter a quantity");return}draft.items.push({m:+$("di").value,q:q});draw()}
function saveRec(){
 if(!draft.name.trim()||!draft.items.length||!(draft.liters>0)){say("Add a name, batch size and ingredients");return}
 var id=Date.now();S.rec.push({id:id,name:draft.name.trim(),liters:draft.liters,items:draft.items});selRec=id;draft={name:"",liters:100,items:[]};save();say("Juice saved")}
function delRec(id){if(confirm("Delete this recipe? Past batches stay in reports.")){S.rec=S.rec.filter(function(r){return r.id!=id});save();draw()}}
function rep(){
 var td=S.batches.filter(function(b){return b.date==today()}),cons={};
 td.forEach(function(b){b.use.forEach(function(u){cons[u.name]=(cons[u.name]||0)+u.act})});
 var keys=Object.keys(cons);
 return '<h1>Reports</h1><h2>Consumed today</h2><div class="card">'+(keys.length?keys.map(function(k){return '<div class="row"><span class="n">'+k+'</span><b>'+f(cons[k],1)+'</b></div>'}).join(""):'<span class="mut">No batches yet today. Save a batch to see consumption.</span>')+'</div>'+
 '<h2>Batch history</h2>'+(S.batches.length?S.batches.map(function(b){
  var varc=b.use.reduce(function(s,u){return s+(u.act-u.std)*(M(u.m)||{cost:0}).cost},0);
  return '<div class="card"><b>'+b.recipe+'</b> <span class="mut">'+b.date+(b.shift?" · "+b.shift:"")+'</span>'+
  '<div class="row"><span class="n">Output</span>'+f(b.out,0)+' L (yield '+f(b.out/b.input*100,1)+'%)</div>'+
  '<div class="row"><span class="n">Total cost</span>'+f(b.total)+'</div>'+
  '<div class="row"><span class="n">Cost per litre</span><b class="ok">'+f(b.total/b.out)+'</b></div>'+
  '<div class="row"><span class="n">Usage vs standard</span><span class="'+(varc>0?"low":"ok")+'">'+(varc>0?"+":"")+f(varc)+'</span></div>'+
  '<div class="row"><span class="n">Quality</span><span class="'+(b.qc=="Pass"?"ok":"low")+'">'+b.qc+(b.brix?" · Brix "+b.brix:"")+(b.ph?" · pH "+b.ph:"")+'</span></div></div>'}).join(""):'<div class="card mut">No batches saved yet.</div>')+
 '<button class="s" onclick="if(confirm(\'Reset all data to the sample set?\')){S=JSON.parse(JSON.stringify(seed));save();draw()}">Reset sample data</button>';
}
draw();
</script></body></html>
